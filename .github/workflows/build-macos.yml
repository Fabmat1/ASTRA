name: macOS build (Apple Silicon)

on:
  # Manual trigger from the Actions tab — pick any version string.
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the .dmg name (e.g. 0.5.1)"
        required: false
        default: "0.5.1"
  # Automatic on version tags: pushing v0.3.4 builds astra-0.3.4-arm64.dmg
  # and attaches it to the GitHub release for that tag.
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed only for the release-upload step on tag builds

jobs:
  build:
    # macos-14/15 runners are genuine Apple Silicon (arm64) machines.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out sources (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Reuse the one-time OpenBLAS/CCfits source builds across runs.
      # Keyed on the script itself so a change to the build logic invalidates it.
      - name: Cache astra-build-macos deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-build-macos
          key: astra-macos-deps-${{ runner.arch }}-${{ hashFiles('build-macos.sh') }}
          restore-keys: astra-macos-deps-${{ runner.arch }}-

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            # Stamp the tag into the binary. Without this the app self-reports
            # whatever git describes at build time, and the in-app updater
            # treats it as a development build.
            echo "stamp=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version || '0.5.1' }}" >> "$GITHUB_OUTPUT"
            echo "stamp=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .app and .dmg
        env:
          ASTRA_VERSION_OVERRIDE: ${{ steps.ver.outputs.stamp }}
        run: ./build-macos.sh "${{ steps.ver.outputs.version }}"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-${{ steps.ver.outputs.version }}-arm64
          path: |
            astra-*.dmg
            astra-*.dmg.sha256
          if-no-files-found: error

      # Only on tag pushes: attach the .dmg to the release for that tag
      # (creates the release if it doesn't exist yet).
      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes 2>/dev/null || true
          # The AppImage job may be creating the same release right now; wait for
          # whichever attempt won before uploading into it.
          for _ in $(seq 1 12); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release upload "${GITHUB_REF_NAME}" astra-*.dmg astra-*.dmg.sha256 --clobber
