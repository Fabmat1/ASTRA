name: AppImage builder image

# Builds the Ubuntu 22.04 environment the AppImage is compiled in (Qt,
# OpenBLAS, the ISIS/S-Lang stack, linuxdeploy tooling) and publishes it to
# GHCR. This is the slow half of the AppImage build — roughly an hour — so it
# runs only when docker/appimage-builder.Dockerfile changes, and the per-release
# workflow (build-appimage.yml) just pulls the result.
#
# The image tag is the same content hash that build-appimage.sh uses locally
# (docker/builder-image-tag.sh), so an unchanged Dockerfile is never rebuilt.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this tag is already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - docker/appimage-builder.Dockerfile
      - docker/builder-image-tag.sh
      - .github/workflows/appimage-builder-image.yml

permissions:
  contents: read
  packages: write   # push to ghcr.io/<owner>/astra-appimage-builder

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      # Qt + OpenBLAS + the ISIS stack make for a multi-GB image; the stock
      # runner image leaves too little headroom to build it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/lib/node_modules
          df -h /

      - name: Resolve image tag
        id: img
        run: |
          hash="$(docker/builder-image-tag.sh)"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/astra-appimage-builder"
          echo "hash=${hash}"      >> "$GITHUB_OUTPUT"
          echo "repo=${repo}"      >> "$GITHUB_OUTPUT"
          echo "ref=${repo}:${hash}" >> "$GITHUB_OUTPUT"
          echo "Builder image: ${repo}:${hash}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this tag is already published
        id: check
        run: |
          if [[ "${{ inputs.force }}" != "true" ]] \
             && docker manifest inspect "${{ steps.img.outputs.ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Already published — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push builder image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/appimage-builder.Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.ref }}
            ${{ steps.img.outputs.repo }}:latest
          # Links the GHCR package to this repository, so build-appimage.yml's
          # repo-scoped GITHUB_TOKEN is allowed to pull it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            QT_VERSION=6.11.1
            OPENBLAS_VERSION=0.3.27
            BUNDLE_ISIS=1

      - name: Summary
        run: |
          {
            echo "### AppImage builder image"
            echo
            echo '`${{ steps.img.outputs.ref }}`'
            echo
            if [[ "${{ steps.check.outputs.exists }}" == "true" ]]; then
              echo "Already published — build skipped."
            else
              echo "Built and pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
